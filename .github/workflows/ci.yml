name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The tests use a fake OCR engine, so the heavy PaddlePaddle/PaddleOCR wheels are skipped.
      - name: Install dependencies (without PaddleOCR)
        run: |
          grep -viE '^(paddlepaddle|paddleocr)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest==8.3.4 httpx==0.28.1
      - name: Run tests
        run: python -m pytest

  frontend-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.4
      - name: Run tests
        run: python -m pytest
